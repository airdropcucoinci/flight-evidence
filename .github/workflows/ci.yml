name: Flight Evidence CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Smoke tests
        run: npm run test:smoke
      - name: Node regression tests
        run: npm run test:node
      - name: Vitest
        run: npm test
      - name: Install Chromium for real browser tests
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser user journeys
        run: npm run test:e2e
      - name: Upload verified competition screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flight-evidence-demo-screenshots
          path: competition-artifacts/*.png
          if-no-files-found: error
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flight-evidence-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Test scenario contract
        run: npm run test:contract
      - name: Package release source snapshot
        run: |
          git archive --format=zip --output=flight-evidence-source.zip HEAD
          sha256sum flight-evidence-source.zip > flight-evidence-source.sha256
      - name: Upload source backup with checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flight-evidence-source-backup
          path: |
            flight-evidence-source.zip
            flight-evidence-source.sha256
          if-no-files-found: error
      - name: Release artifact safety scan
        run: |
          mkdir -p "$RUNNER_TEMP/flight-evidence-release"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/flight-evidence-release"
          (cd "$RUNNER_TEMP/flight-evidence-release" && node scripts/check-release-artifacts.mjs)
