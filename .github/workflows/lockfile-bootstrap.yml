name: One-time npm lockfile bootstrap
on:
  push:
    branches:
      - fix/invalid-upload-stale-report-20261019

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.head_commit.message == 'chore: bootstrap locked npm dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/invalid-upload-stale-report-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate verifiable npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
          else
            git commit -m "build: commit npm package-lock for reproducible CI"
            git push origin HEAD:refs/heads/fix/invalid-upload-stale-report-20261019
          fi
